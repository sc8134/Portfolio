<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <!-- Background card -->
  <rect width="480" height="320" rx="20" fill="#EDE6DF"/>

  <!-- Browser / editor window -->
  <rect x="40" y="40" width="400" height="240" rx="14" fill="white" stroke="#D9CFC5" stroke-width="1.5"/>

  <!-- Window title bar -->
  <rect x="40" y="40" width="400" height="38" rx="14" fill="#1E3A5F"/>
  <rect x="40" y="60" width="400" height="18" fill="#1E3A5F"/>

  <!-- Traffic lights -->
  <circle cx="68" cy="59" r="6" fill="#E8654A"/>
  <circle cx="88" cy="59" r="6" fill="#F5C842"/>
  <circle cx="108" cy="59" r="6" fill="#4CAF50"/>

  <!-- Tab label -->
  <rect x="130" y="48" width="100" height="22" rx="4" fill="#2B4D7A"/>
  <rect x="136" y="54" width="60" height="6" rx="3" fill="#7A9AB5"/>
  <rect x="136" y="63" width="40" height="4" rx="2" fill="#4A6080"/>

  <!-- Code lines -->
  <!-- Line 1: import statement -->
  <rect x="68" y="100" width="30" height="7" rx="3" fill="#E8654A"/>
  <rect x="104" y="100" width="55" height="7" rx="3" fill="#4A6080"/>
  <rect x="165" y="100" width="20" height="7" rx="3" fill="#E8654A"/>
  <rect x="191" y="100" width="70" height="7" rx="3" fill="#2B4D7A"/>

  <!-- Line 2 -->
  <rect x="68" y="118" width="20" height="7" rx="3" fill="#E8654A"/>
  <rect x="94" y="118" width="45" height="7" rx="3" fill="#1E3A5F"/>
  <rect x="145" y="118" width="10" height="7" rx="3" fill="#4A6080"/>

  <!-- Line 3 indented -->
  <rect x="84" y="136" width="35" height="7" rx="3" fill="#4A6080"/>
  <rect x="125" y="136" width="10" height="7" rx="3" fill="#E8654A"/>
  <rect x="141" y="136" width="80" height="7" rx="3" fill="#2B4D7A"/>
  <rect x="227" y="136" width="10" height="7" rx="3" fill="#E8654A"/>

  <!-- Line 4 indented -->
  <rect x="84" y="154" width="25" height="7" rx="3" fill="#4A6080"/>
  <rect x="115" y="154" width="10" height="7" rx="3" fill="#E8654A"/>
  <rect x="131" y="154" width="100" height="7" rx="3" fill="#2B4D7A"/>

  <!-- Line 5 -->
  <rect x="68" y="172" width="10" height="7" rx="3" fill="#4A6080"/>

  <!-- Line 6 blank then comment -->
  <rect x="68" y="190" width="15" height="7" rx="3" fill="#7A9AB5"/>
  <rect x="89" y="190" width="120" height="7" rx="3" fill="#7A9AB5"/>

  <!-- Line 7 -->
  <rect x="68" y="208" width="20" height="7" rx="3" fill="#E8654A"/>
  <rect x="94" y="208" width="55" height="7" rx="3" fill="#1E3A5F"/>
  <rect x="155" y="208" width="10" height="7" rx="3" fill="#4A6080"/>
  <rect x="171" y="208" width="40" height="7" rx="3" fill="#2B4D7A"/>

  <!-- Cursor blink -->
  <rect x="68" y="226" width="2" height="14" rx="1" fill="#E8654A"/>

  <!-- Line numbers sidebar -->
  <rect x="40" y="78" width="20" height="202" fill="#F5F0EB"/>
  <rect x="44" y="100" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="118" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="136" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="154" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="172" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="190" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="208" width="10" height="5" rx="2" fill="#D9CFC5"/>
  <rect x="44" y="226" width="10" height="5" rx="2" fill="#E8654A"/>

  <!-- Floating badge: coral pill -->
  <rect x="310" y="220" width="110" height="36" rx="18" fill="#E8654A" filter="url(#shadow)"/>
  <rect x="322" y="232" width="50" height="6" rx="3" fill="white"/>
  <rect x="322" y="242" width="35" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>

  <!-- Small floating tag top right -->
  <rect x="355" y="90" width="72" height="28" rx="8" fill="white" stroke="#D9CFC5" stroke-width="1"/>
  <circle cx="368" cy="104" r="7" fill="#E8654A"/>
  <rect x="380" y="99" width="36" height="5" rx="2.5" fill="#1E3A5F"/>
  <rect x="380" y="107" width="24" height="4" rx="2" fill="#4A6080"/>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E8654A" flood-opacity="0.25"/>
    </filter>
  </defs>
</svg>
